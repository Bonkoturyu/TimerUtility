#:schema https://developers.openai.com/codex/config-schema.json

# メインエージェント以外に同時実行できる SubAgent は 1 つまでとする。
# 再帰委譲の禁止は AGENTS.md と docs/ai-collaboration.md で規定する。
[agents]
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[agents.impl-helper]
description = "Terra/highで、仕様が明確な実装・テスト・機械的編集を担当し、設計判断はメインエージェントへ返す"
config_file = "agents/impl-helper.toml"

[agents.luna-helper]
description = "Luna/maxで、大量の機械的編集・文書同期・境界付き調査と検証を担当する"
config_file = "agents/luna-helper.toml"
