name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# PR: 同一 PR (refs/pull/N/merge) で group を共有し旧 run を自動キャンセル。
# main: sha を付与して run ごとに unique group とし、キャンセルも直列化もせず
#       コミットごとに独立した CI 結果を並列で残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# restricted default GITHUB_TOKEN 環境でも動くよう明示的に付与する。
# checkout に contents:read、dorny/paths-filter の PR 変更検出に pull-requests:read が必要。
permissions:
  contents: read
  pull-requests: read

jobs:
  flutter-checks:
    name: Flutter analyze, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # docs 系のみの変更では Flutter ツールチェーンのセットアップごとスキップする。
      # required check (このジョブ) は step スキップでも success で完了するため
      # branch protection とは干渉しない。
      # 例外: docs/translations.md は tool/check_translations_doc.dart の検査対象
      # のため、単独変更でも CI を実行する。
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: changes
        with:
          # 'every': 変更ファイルが全パターン (否定含む) を満たす場合のみ true
          predicate-quantifier: 'every'
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!LICENSE'
              - '!.gitignore'
            translations_doc:
              - 'docs/translations.md'
      # subosito/flutter-action は内部で actions/cache@v5 を参照するため、
      # full-length SHA 必須設定と両立しない。公式 SDK archive を checksum 検証して使う。
      - name: Flutter SDKをセットアップ
        env:
          FLUTTER_ARCHIVE_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.8-stable.tar.xz
          FLUTTER_ARCHIVE_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/flutter_linux_3.44.8-stable.tar.xz"
          flutter_root="$RUNNER_TEMP/flutter"

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "$FLUTTER_ARCHIVE_URL" \
            --output "$archive_path"
          echo "$FLUTTER_ARCHIVE_SHA256  $archive_path" | sha256sum --check --strict
          tar --extract --xz --file "$archive_path" --directory "$RUNNER_TEMP"
          rm --force "$archive_path"

          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" config --no-analytics
          "$flutter_root/bin/flutter" --version
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - run: flutter pub get
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - run: dart format --set-exit-if-changed .
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - run: dart run tool/check_translations_doc.dart
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - run: flutter analyze --fatal-infos
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - run: flutter test
        if: steps.changes.outputs.source == 'true' || steps.changes.outputs.translations_doc == 'true'
      - name: Android Native Unit Test
        working-directory: android
        run: ./gradlew app:testDebugUnitTest
        if: steps.changes.outputs.source == 'true'
