name: Release

run-name: Release ${{ inputs.release_tag }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed AAB and publish GitHub Release
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: リリース要求を検証
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::リリースWorkflowはmainブランチから実行してください。"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::リリースタグはvMAJOR.MINOR.PATCH形式で入力してください。"
            exit 1
          fi

          version_value="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          if [[ ! "$version_value" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yamlのversionはMAJOR.MINOR.PATCH+BUILD形式である必要があります。"
            exit 1
          fi

          expected_tag="v${version_value%%+*}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::リリースタグ$RELEASE_TAGはpubspec.yamlのversion $version_value と一致しません（期待値: $expected_tag）。"
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_check_status=$?
          set -e

          case "$tag_check_status" in
            0)
              echo "::error::タグ$RELEASE_TAGはすでに存在します。"
              exit 1
              ;;
            2)
              ;;
            *)
              echo "::error::リモートタグを確認できませんでした（終了コード: $tag_check_status）。"
              exit 1
              ;;
          esac

      # subosito/flutter-action は内部で actions/cache@v5 を参照するため、
      # full-length SHA 必須設定と両立しない。公式 SDK archive を checksum 検証して使う。
      - name: Flutter SDKをセットアップ
        env:
          FLUTTER_ARCHIVE_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.8-stable.tar.xz
          FLUTTER_ARCHIVE_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/flutter_linux_3.44.8-stable.tar.xz"
          flutter_root="$RUNNER_TEMP/flutter"

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "$FLUTTER_ARCHIVE_URL" \
            --output "$archive_path"
          echo "$FLUTTER_ARCHIVE_SHA256  $archive_path" | sha256sum --check --strict
          tar --extract --xz --file "$archive_path" --directory "$RUNNER_TEMP"
          rm --force "$archive_path"

          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" config --no-analytics
          "$flutter_root/bin/flutter" --version

      # android/build.gradle.kts の sourceCompatibility/targetCompatibility (JDK 17) に合わせる。
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      # docs/release-signing.md §6 の Secrets 一覧に対応。
      # storeFile は runner の一時ディレクトリに置き、build 後に必ず削除する。
      - name: 署名Secretを検証
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            UPLOAD_KEYSTORE_BASE64 \
            UPLOAD_KEY_ALIAS \
            UPLOAD_KEY_PASSWORD \
            UPLOAD_STORE_PASSWORD
          do
            if [[ -z "${!secret_name-}" ]]; then
              echo "::error::署名Secret $secret_name が未登録または空です。"
              exit 1
            fi
          done

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/upload-keystore.jks"
          test -s "${{ runner.temp }}/upload-keystore.jks"

      - name: Write key.properties
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_STORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=${{ runner.temp }}/upload-keystore.jks
          EOF

      - run: flutter build appbundle --release

      # 署名鍵はビルド直後に runner 上から確実に消す (runner は使い捨てだが多層防御として)。
      - name: Remove signing secrets from runner
        if: always()
        run: rm -f android/key.properties "${{ runner.temp }}/upload-keystore.jks"

      # Play Console への自動 upload (fastlane supply 等) は Phase 11.10 完了後の
      # 継続改善として保留。まずは手動 upload 経路を確立する (docs/release-signing.md §6)。
      - name: Publish GitHub Release with AAB artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
